# Lokal dev muhit: PostgreSQL 18 + PostGIS, Redis va MinIO (S3-mos object storage).
# Faqat lokal ishlab chiqish uchun — parollar production'da ishlatilmaydi.
name: matchup

services:
  db:
    image: postgis/postgis:18-3.6
    # Rasmiy postgis image'larida arm64 yo'q -> Apple Silicon'da Rosetta emulyatsiyasi orqali ishlaydi
    platform: linux/amd64
    environment:
      POSTGRES_USER: matchup
      POSTGRES_PASSWORD: matchup_dev_only
      POSTGRES_DB: matchup
      TZ: UTC
    ports:
      - "${MATCHUP_DB_PORT:-5432}:5432"
    volumes:
      # PG18 image'larida volume /var/lib/postgresql ga ulanadi (PGDATA = /var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchup -d matchup"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "${MATCHUP_REDIS_PORT:-6379}:6379"

  # S3-mos storage: highlight yuklash (presigned multipart) va worker natijalari.
  # minio/minio image'lari Docker Hub'dan olib tashlangan -> Bitnami'ning muzlatilgan nusxasi (server + mc).
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: matchup
      MINIO_ROOT_PASSWORD: matchup_dev_only
    ports:
      - "${MATCHUP_MINIO_PORT:-9000}:9000"
      - "${MATCHUP_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Bir martalik: bucket'lar va lifecycle (infra/local/minio-init.sh, idempotent)
  minio-init:
    image: bitnamilegacy/minio:2025.7.23
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MC: /opt/bitnami/minio-client/bin/mc
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: matchup
      MINIO_ROOT_PASSWORD: matchup_dev_only
    volumes:
      - ./infra/local/minio-init.sh:/init/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  miniodata:

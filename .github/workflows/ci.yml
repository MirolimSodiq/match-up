name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: Typecheck + host unit testlar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-typecheck-${{ runner.os }}-
      - name: Typecheck (barcha paketlar)
        run: pnpm turbo run typecheck
      - name: Host unit testlar (vitest)
        run: pnpm turbo run test --filter=@matchup/host

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LINT_CLI_VERSION: 1.34.5
      # CLI har ishga tushishda Redocly'ga telemetriya yuboradi — CI tashqi servisni kutmasin
      REDOCLY_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # npx har run'da CLI'ni (~140 MB, 100+ paket) registry'dan yuklardi: registry sekinlashganda yuklashning
      # o'zi 5 daqiqadan oshib job bekor bo'lgan. Kesh (versiya bo'yicha) + --prefer-offline — tarmoqsiz, ~1 s.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-redocly-${{ runner.os }}-${{ env.LINT_CLI_VERSION }}
      - run: npm exec --prefer-offline --yes "@redocly/cli@${LINT_CLI_VERSION}" -- lint api/openapi.yaml

  api-e2e:
    name: API e2e (PostGIS + Valkey)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: matchup
          POSTGRES_PASSWORD: matchup_ci_only
          POSTGRES_DB: matchup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchup -d matchup"
          --health-interval 3s --health-timeout 3s --health-retries 40
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      # Highlight upload e2e (presigned multipart). Bucket'larni test global-setup yaratadi.
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: matchup
          MINIO_ROOT_PASSWORD: matchup_ci_only
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live"
          --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      E2E_DATABASE_URL: postgres://matchup:matchup_ci_only@localhost:5432/matchup_e2e
      E2E_REDIS_URL: redis://localhost:6379/15
      E2E_S3_ENDPOINT: http://localhost:9000
      E2E_S3_ACCESS_KEY_ID: matchup
      E2E_S3_SECRET_ACCESS_KEY: matchup_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: E2E (jest, haqiqiy DB)
        run: pnpm --filter @matchup/api test:e2e

  media-worker:
    name: Media worker (pytest + FFmpeg)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Production image (services/media-worker/Dockerfile) bilan bir xil base: testlar prod'dagi FFmpeg'da
    # (Debian trixie, 7.1) o'tadi. Paketlar deb.debian.org (CDN) dan — runner'ning Ubuntu mirror'i vaqti-vaqti
    # bilan sekinlashib (odatda ~20 s, ba'zan 5–15+ daqiqa) job'ni bekor qilgan.
    container: python:3.12-slim-trixie
    defaults:
      run:
        working-directory: services/media-worker
    steps:
      - uses: actions/checkout@v7
      # Test videolari FFmpeg lavfi bilan generatsiya qilinadi
      - name: FFmpeg
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -q -o Acquire::Retries=3 update
          apt-get -q -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: uv
        timeout-minutes: 3
        run: pip install uv==0.13.4
      - name: pytest
        run: |
          uv sync --frozen
          uv run pytest -q

  db-verify:
    name: DB testlari (verify.sh, pgbench race)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: matchup
          POSTGRES_PASSWORD: matchup_ci_only
          POSTGRES_DB: matchup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchup -d matchup"
          --health-interval 3s --health-timeout 3s --health-retries 40
    steps:
      - uses: actions/checkout@v7
      # pgbench Debian/PGDG'da server paketida (postgresql-client-18 da yo'q) — klaster yaratilmaydi
      - name: PostgreSQL 18 psql + pgbench (PGDG apt)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo mkdir -p /etc/postgresql-common/createcluster.d
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.d/ci.conf
          sudo apt-get install -y --no-install-recommends postgresql-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: verify.sh (DATABASE_URL rejimi)
        env:
          DATABASE_URL: postgres://matchup:matchup_ci_only@localhost:5432/postgres
        run: |
          psql --version && pgbench --version
          ./db/tests/verify.sh

  # Generatsiya qilinadigan fayllar manbasi bilan mos: Drizzle sxemasi toza bazadan (migratsiyalar →
  # db:pull), contracts — api/openapi.yaml dan. Farq bo'lsa, fayl qo'lda emas, shu buyruqlar bilan yangilanadi.
  generated-drift:
    name: Generated fayllar drift (Drizzle, contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: matchup
          POSTGRES_PASSWORD: matchup_ci_only
          POSTGRES_DB: matchup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchup -d matchup"
          --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      DATABASE_URL: postgres://matchup:matchup_ci_only@localhost:5432/matchup
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Drizzle sxemasi (db:migrate + db:pull)
        run: |
          pnpm --filter @matchup/api db:migrate
          pnpm --filter @matchup/api db:pull
          git diff --exit-code apps/api/src/db || {
            echo "::error::apps/api/src/db migratsiyalardan farq qiladi — toza bazada db:migrate + db:pull qilib, natijani commit qiling"
            exit 1
          }
      - name: Contracts (openapi-typescript)
        run: |
          pnpm --filter @matchup/contracts generate
          git diff --exit-code packages/contracts/src/schema.ts || {
            echo "::error::packages/contracts/src/schema.ts api/openapi.yaml dan farq qiladi — contracts generate qilib, natijani commit qiling"
            exit 1
          }

  admin-build:
    name: Admin build (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v6
        with:
          path: apps/admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm turbo run build --filter=@matchup/admin

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: .
            file: apps/api/Dockerfile
          - app: admin
            context: .
            file: apps/admin/Dockerfile
          - app: media-worker
            context: services/media-worker
            file: services/media-worker/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Faqat build (push yo'q) — tekshiruv; ECR'ga push va deploy — deploy.yml (main, OIDC)
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: matchup-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Image ishga tushadi (api — migratsiya buyrug'i mavjud)
        if: matrix.app == 'api'
        run: docker run --rm --entrypoint node matchup-api:ci -e "require('fs').accessSync('dist/scripts/migrate.js'); require('fs').accessSync('db/migrations/0001_core_mvp.sql')"
      - name: Image ishga tushadi (media-worker — FFmpeg va paket)
        if: matrix.app == 'media-worker'
        run: docker run --rm --entrypoint sh matchup-media-worker:ci -c "ffmpeg -version | head -1 && python -c 'import media_worker, boto3, redis, httpx; print(media_worker.WORKER_VERSION)'"

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # hashicorp/terraform image orqali; AWS credential'lar ishlatilmaydi, plan/apply yo'q
      - run: ./infra/terraform/check.sh

  deploy-script:
    name: Deploy skriptlari (soxta aws/docker, shellcheck, compose, Caddyfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x infra/deploy/ecs-deploy.sh infra/deploy/ecs-deploy.test.sh
      - run: infra/deploy/ecs-deploy.test.sh
      # Hetzner (docs/DEPLOYMENT.md §10)
      - run: shellcheck -x infra/hetzner/*.sh infra/hetzner/matchup
      - run: infra/hetzner/deploy.test.sh
      - name: compose.yml (env.example bilan)
        run: docker compose -f infra/hetzner/compose.yml --env-file infra/hetzner/env.example config --quiet
        env:
          IMAGE_REGISTRY: ghcr.io/example/match-up
          IMAGE_TAG: ci
      - name: Caddyfile
        run: >-
          docker run --rm -v "$PWD/infra/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e API_DOMAIN=api.example.com -e ADMIN_DOMAIN=admin.example.com -e ACME_EMAIL=ops@example.com
          -e "ADMIN_ALLOW_IPS=0.0.0.0/0 ::/0"
          caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

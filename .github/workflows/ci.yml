name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: Typecheck + host unit testlar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-typecheck-${{ runner.os }}-
      - name: Typecheck (barcha paketlar)
        run: pnpm turbo run typecheck
      - name: Host unit testlar (vitest)
        run: pnpm turbo run test --filter=@matchup/host

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml

  api-e2e:
    name: API e2e (PostGIS + Valkey)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: matchup
          POSTGRES_PASSWORD: matchup_ci_only
          POSTGRES_DB: matchup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchup -d matchup"
          --health-interval 3s --health-timeout 3s --health-retries 40
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://matchup:matchup_ci_only@localhost:5432/matchup_e2e
      E2E_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: E2E (jest, haqiqiy DB)
        run: pnpm --filter @matchup/api test:e2e

  db-verify:
    name: DB testlari (verify.sh, pgbench race)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: matchup
          POSTGRES_PASSWORD: matchup_ci_only
          POSTGRES_DB: matchup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchup -d matchup"
          --health-interval 3s --health-timeout 3s --health-retries 40
    steps:
      - uses: actions/checkout@v7
      # pgbench Debian/PGDG'da server paketida (postgresql-client-18 da yo'q) — klaster yaratilmaydi
      - name: PostgreSQL 18 psql + pgbench (PGDG apt)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo mkdir -p /etc/postgresql-common/createcluster.d
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.d/ci.conf
          sudo apt-get install -y --no-install-recommends postgresql-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: verify.sh (DATABASE_URL rejimi)
        env:
          DATABASE_URL: postgres://matchup:matchup_ci_only@localhost:5432/postgres
        run: |
          psql --version && pgbench --version
          ./db/tests/verify.sh

  admin-build:
    name: Admin build (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v6
        with:
          path: apps/admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm turbo run build --filter=@matchup/admin

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, admin]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Faqat build (push yo'q): registry/deploy bosqichi AWS OIDC role ulangandan keyin qo'shiladi
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: matchup-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Image ishga tushadi (api — migratsiya buyrug'i mavjud)
        if: matrix.app == 'api'
        run: docker run --rm --entrypoint node matchup-api:ci -e "require('fs').accessSync('dist/scripts/migrate.js'); require('fs').accessSync('db/migrations/0001_core_mvp.sql')"

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # hashicorp/terraform image orqali; AWS credential'lar ishlatilmaydi, plan/apply yo'q
      - run: ./infra/terraform/check.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

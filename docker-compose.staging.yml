# Lokal "staging": production image'lar (apps/api, apps/admin, services/media-worker) + alohida DB, Valkey va MinIO.
# Dev stack'dan (docker-compose.yml, 5432/6379) to'liq ajratilgan: boshqa project nomi, volume va 3200+ portlar.
#
#   ./infra/local/gen-staging-keys.sh
#   docker compose -f docker-compose.staging.yml up -d --build
#   curl localhost:3200/health          # API
#   open http://localhost:3201          # admin
#   http://localhost:3204               # MinIO S3 API (presigned URL'lar shu host bilan imzolanadi)
#
# NODE_ENV=production: OTP_PROVIDER=console taqiqlangan, shuning uchun eskiz. Haqiqiy SMS uchun
# ESKIZ_EMAIL/ESKIZ_PASSWORD ni shell env yoki .env.staging orqali bering (--env-file .env.staging).
name: matchup-staging

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://matchup:${STAGING_DB_PASSWORD:-matchup_staging_local}@db:5432/matchup
  REDIS_URL: redis://redis:6379
  PUBLIC_BASE_URL: http://localhost:${STAGING_API_PORT:-3200}
  JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
  JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
  TICKET_PRIVATE_KEY_FILE: /run/secrets/ticket_private
  TICKET_PUBLIC_KEY_FILE: /run/secrets/ticket_public
  OTP_PROVIDER: eskiz
  ESKIZ_EMAIL: ${ESKIZ_EMAIL:-staging-placeholder@example.invalid}
  ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-placeholder}
  PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-demo-payme}
  PAYME_KEY: ${PAYME_KEY:-payme_test_key}
  CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-1000}
  CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-2000}
  CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-click_test_secret}
  SENTRY_DSN: ${SENTRY_DSN_API:-}
  SENTRY_ENVIRONMENT: staging-local
  # Highlight video: API konteyner ichidan minio:9000 ga, telefon/brauzer esa localhost:3204 ga ulanadi
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:${STAGING_MINIO_PORT:-3204}
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: matchup
  S3_SECRET_ACCESS_KEY: ${STAGING_MINIO_PASSWORD:-matchup_staging_local}
  S3_FORCE_PATH_STYLE: "true"
  MEDIA_RAW_BUCKET: matchup-media-raw
  MEDIA_BUCKET: matchup-media
  MEDIA_WORKER_TOKEN: ${STAGING_MEDIA_WORKER_TOKEN:-staging-local-media-worker-token-000000000000}

services:
  db:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: matchup
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-matchup_staging_local}
      POSTGRES_DB: matchup
      TZ: UTC
    ports:
      - "${STAGING_DB_PORT:-3202}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP orqali: birinchi init paytidagi vaqtinchalik server faqat unix socket'da tinglaydi
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U matchup -d matchup"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: valkey/valkey:8-alpine
    # BullMQ: kalitlar hech qachon evict qilinmasligi kerak (ElastiCache parameter group'da ham shunday)
    command: ["valkey-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "${STAGING_REDIS_PORT:-3203}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Bir martalik migratsiya (ECS'dagi migrate task bilan bir xil buyruq). --seed faqat lokal staging uchun.
  migrate:
    image: matchup-api:staging-local
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/scripts/migrate.js", "--seed"]
    environment:
      DATABASE_URL: postgres://matchup:${STAGING_DB_PASSWORD:-matchup_staging_local}@db:5432/matchup
      SEED_FILE: /app/db/seed/dev_seed.sql
    volumes:
      - ./db/seed:/app/db/seed:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: matchup-api:staging-local
    build: *api-build
    environment: *api-env
    secrets: [jwt_private, jwt_public, ticket_private, ticket_public]
    ports:
      - "${STAGING_API_PORT:-3200}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: matchup
      MINIO_ROOT_PASSWORD: ${STAGING_MINIO_PASSWORD:-matchup_staging_local}
    ports:
      - "${STAGING_MINIO_PORT:-3204}:9000"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: bitnamilegacy/minio:2025.7.23
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MC: /opt/bitnami/minio-client/bin/mc
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: matchup
      MINIO_ROOT_PASSWORD: ${STAGING_MINIO_PASSWORD:-matchup_staging_local}
    volumes:
      - ./infra/local/minio-init.sh:/init/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Python worker (FFmpeg): Redis Stream matchup:media-jobs -> HLS/thumbnail/9:16 -> API /internal/media/...
  media-worker:
    image: matchup-media-worker:staging-local
    build:
      context: services/media-worker
    read_only: true
    tmpfs:
      - /tmp:size=2g
    environment: &media-worker-env
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:3000
      MEDIA_WORKER_TOKEN: ${STAGING_MEDIA_WORKER_TOKEN:-staging-local-media-worker-token-000000000000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: matchup
      S3_SECRET_ACCESS_KEY: ${STAGING_MINIO_PASSWORD:-matchup_staging_local}
      S3_FORCE_PATH_STYLE: "true"
    depends_on: &media-worker-deps
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # AI-Cam A: to'liq o'yin yozuvlari — alohida stream, kattaroq ish papkasi (prod'da alohida ECS servis)
  media-worker-recording:
    image: matchup-media-worker:staging-local
    read_only: true
    tmpfs:
      - /tmp:size=8g
    environment:
      <<: *media-worker-env
      MEDIA_JOBS_STREAM: matchup:media-jobs:recording
    depends_on: *media-worker-deps
    restart: unless-stopped

  admin:
    image: matchup-admin:staging-local
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      API_URL: http://api:3000
      SENTRY_DSN: ${SENTRY_DSN_ADMIN:-}
      SENTRY_ENVIRONMENT: staging-local
    ports:
      - "${STAGING_ADMIN_PORT:-3201}:3100"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# Fayl orqali secret'lar (konteynerda /run/secrets/<nom>) — infra/local/gen-staging-keys.sh yaratadi
secrets:
  jwt_private:
    file: ./.staging/keys/jwt-private.pem
  jwt_public:
    file: ./.staging/keys/jwt-public.pem
  ticket_private:
    file: ./.staging/keys/ticket-private.pem
  ticket_public:
    file: ./.staging/keys/ticket-public.pem

volumes:
  pgdata:
  miniodata:

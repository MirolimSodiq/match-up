openapi: 3.1.0
info:
  title: Match Up API
  version: 0.1.0
  summary: Pickup sports platform — MVP API (player, host, admin, payment webhooks)
  description: |
    MVP REST API. Umumiy qoidalar:

    * **Auth:** `Authorization: Bearer <JWT>` (EdDSA, access token 15 daqiqa). Refresh token rotation + reuse detection.
    * **Pul:** har doim `Money` obyekti — `amount` minor units'da (UZS uchun tiyin: 45 000 so'm = `4500000`).
    * **Vaqt:** ISO 8601, UTC (`2026-10-18T14:00:00Z`). Mahalliy ko'rsatish uchun `timezone` maydoni beriladi.
    * **Til:** `Accept-Language` (`uz-Latn`, `uz-Cyrl`, `ru`, `en`) -> xato matnlari va kontent tarjimasi.
    * **Xatolar:** RFC 9457 Problem Details (`application/problem+json`), mashina o'qiydigan `code` bilan.
    * **Idempotency:** pul bilan bog'liq POST'larda `Idempotency-Key` majburiy (24 soat saqlanadi).
    * **Pagination:** cursor-based (`cursor`, `limit` -> `next_cursor`).
  contact:
    name: Match Up Engineering
    email: engineering@matchup.example
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.uz-1.matchup.example
    description: UZ cell (MVP — AWS eu-central-1, Frankfurt)
  - url: http://{host}:{port}
    description: Lokal dev (NestJS)
    variables:
      host: { default: localhost }
      port: { default: '3000' }
tags:
  - name: Auth
    description: OTP (SMS/Telegram) va social login, token'lar
  - name: Profile
    description: Profil, sport darajalari, consent'lar, GDPR so'rovlari
  - name: Catalog
    description: Sport turlari, shaharlar, venue'lar
  - name: Discovery
    description: Match qidirish va tafsilotlar
  - name: Waivers
    description: Javobgarlikdan voz kechish hujjatlari va imzolar
  - name: Bookings
    description: Joy band qilish, checkout, bekor qilish, chipta (QR)
  - name: Webhooks
    description: To'lov provayderlaridan keladigan chaqiruvlar (Payme, Click, Uzum, Stripe)
  - name: Host
    description: Freelance Match Host paneli — offer'lar, roster, check-in, highlight
  - name: Media
    description: |
      Host yuklash oqimi: S3 multipart (presigned URL'lar, video API orqali o'tmaydi), davom ettirish, yakunlash.
      Lokal — MinIO, production — S3 + CloudFront (eu-central-1).
  - name: Highlights
    description: |
      Player feed'i (match va profil), like, ulashish, HLS ijro. Highlight faqat match ishtirokchilariga ko'rinadi
      (`visibility = participants`); teglar — faqat `media_appearance` consent'i borlar.
  - name: Recordings
    description: |
      AI-Cam Bosqich A — to'liq o'yin yozuvi (`docs/AI_CAM.md`). Maydondagi 2–3 telefon (`left`, `right`, `wide`)
      butun o'yinni yozadi; host o'z telefonida lahzalarni belgilaydi ("Highlight!", "Kick-off"). Yozuv sessiyasi
      match'ga 1:1, shuning uchun yo'llar match bo'yicha — internet yo'q paytda boshlangan yozuv keyin ro'yxatga olinadi
      (`client_camera_id`, `client_marker_id` — qurilma yaratadi, takroriy yuborish xavfsiz).

      Yuklash — oddiy media oqimi (S3 multipart, ≤ 40 GB, ≤ 3 soat, qism 16 MiB): davomi `GET /v1/media/{id}/upload`,
      yakuni `POST /v1/media/{id}/complete` (`parts` siz). Worker HLS 1080p/720p/480p yasaydi; kamera tayyor bo'lgach
      belgilardan klip'lar avtomatik kesiladi (`clip_v1`: belgidan 12 s oldin — 3 s keyin) va oddiy highlight
      sifatida feed'ga chiqadi. Birinchi kamera tayyor bo'lganda ishtirokchilarga `recording.ready` push.
  - name: Internal
    description: |
      Python media worker -> API (`Authorization: Bearer <MEDIA_WORKER_TOKEN>`). Faqat VPC ichida —
      ALB `/internal/*` ni tashqariga ochmaydi. Worker DB'ga yozmaydi: holat `media_processing_jobs` da.
  - name: Notifications
    description: |
      Push token'lar (Expo; keyinchalik FCM/APNs), in-app xabarlar tarixi.

      Xabarlar outbox event'laridan yaratiladi (`BookingConfirmed`, `BookingCancelled`, `RefundIssued`,
      `MatchCancelled`, `MatchCompleted`, `HostOffered`, `SlotsReleased` -> kutish ro'yxati taklifi) va
      eslatmalar job'idan (T-24h, T-2h). Matn — `users.locale` (uz-Latn, ru, en). Tranzaksion xabarlar
      har doim yuboriladi; marketing (`match.new`) — faqat `marketing_push` consent bilan.

      Push `data` maydoni: `url` — ilova ichidagi deep link (masalan `/booking/{id}`, `/match/{id}`,
      host ilovasida `/?offer={assignment_id}`), `type`, `notification_id` va tegishli id'lar.
  - name: Realtime
    description: |
      **WebSocket (Socket.IO v4)** — REST emas, OpenAPI path'lari yo'q. Ulanish:
      `io(API_URL, { path: '/ws', transports: ['websocket'], auth: { token: '<access JWT>' } })`.
      Token ixtiyoriy (ochiq xonalar uchun); yaroqsiz token bilan ulanish `connect_error: UNAUTHORIZED`
      bilan rad etiladi — ilova token'ni yangilab qayta ulanadi. Bir nechta API instance Redis adapter
      orqali bog'langan. Akkaunt o'chirilganda (GDPR erasure) server foydalanuvchining barcha ulanishlarini
      uzadi (`disconnect: io server disconnect`); o'chirilgan akkaunt token'i bilan qayta ulanish — `UNAUTHORIZED`.

      Xonaga obuna: `socket.emit('subscribe', { room }, ack)` -> `{ ok: true, room, state? }` yoki
      `{ ok: false, code: BAD_REQUEST | UNAUTHORIZED | FORBIDDEN | NOT_FOUND | RATE_LIMITED }`.
      `state` — joriy holat (qayta ulangandan keyin sinxronlash uchun). `unsubscribe` — xuddi shunday.

      | Xona | Kim | Event | Payload |
      |---|---|---|---|
      | `match:{id}` | hamma (token shart emas) | `slots.updated` | `{match_id, available, taken, max, status}` (`taken` = hold + confirmed) |
      | `booking:{id}` | faqat booking egasi | `booking.updated` | `{booking_id, match_id, status}` |
      | `host:{userId}` | faqat o'sha host | `offer.created` | `{assignment_id, match_id, offer_expires_at}` |
      | `host:{userId}` | faqat o'sha host | `offer.closed` | `{assignment_id, match_id, reason: taken}` |

      TypeScript tiplari: `@matchup/contracts` -> `realtime.ts` (`RealtimeEvents`, `SubscribeAck`).

      Event'lar transactional outbox consumer'idan chiqadi (at-least-once, bir necha soniya kechikish bilan);
      payload — holat snapshot'i, shuning uchun takroriy event zararsiz. Polling'ni to'ldiradi, o'rnini bosmaydi.
  - name: Admin
    description: |
      Ichki operatsiyalar paneli: venue/pitch katalogi, match'lar (yaratish, nashr, bekor qilish, jadval, tafsilot),
      host'lar, to'lovlar, refund navbati, dashboard. Har bir mutatsiya `audit_logs` ga yoziladi.
      Jadvallar offset pagination (`limit`, `offset` -> `total`) ishlatadi.

security:
  - bearerAuth: []

paths:
  # ===========================================================================
  # AUTH
  # ===========================================================================
  /v1/auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: OTP kod yuborish
      description: |
        Rate limit: telefon raqam bo'yicha 1/60s va 5/soat, IP bo'yicha 20/soat (Redis).
        `channel=telegram` — kod rasmiy Telegram bot orqali (SMS'dan arzon va tez).
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: E.164, examples: ['+998901234567'] }
                channel: { type: string, enum: [sms, telegram], default: sms }
      responses:
        '200':
          description: Kod yuborildi
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, expires_in, resend_after]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_in: { type: integer, description: soniya, examples: [300] }
                  resend_after: { type: integer, description: soniya, examples: [60] }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: OTP'ni tasdiqlash va token olish
      description: 5 ta noto'g'ri urinishdan keyin challenge bloklanadi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code, device]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/social:
    post:
      tags: [Auth]
      operationId: socialLogin
      summary: Google / Apple / Telegram orqali kirish
      description: |
        * **Google / Apple** — ID token (JWT) provider JWKS'i bilan tekshiriladi (RS256/ES256): imzo, `iss`,
          `aud` (bizning client ID'lardan biri), `exp`/`iat`. Token'da `nonce` bo'lsa, client xom `nonce`ni yuborishi
          shart (token'dagi qiymat = xom nonce yoki uning SHA-256 hex'i).
        * **Telegram** — Login Widget / `oauth.telegram.org` natijasi: `hash = HMAC-SHA256(data_check_string, SHA256(bot_token))`,
          `auth_date` 24 soatdan eski bo'lmasligi kerak.
        * Har bir token / Telegram natijasi **bir martalik** (replay himoyasi).
        * Akkaunt faqat `(provider, provider_uid)` bo'yicha topiladi; topilmasa — yangi akkaunt (telefonsiz, `is_new_user = true`).
          Email bo'yicha mavjud akkauntga **avtomatik bog'lanmaydi** — bog'lash faqat kirgan holda `POST /v1/me/identities`.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SocialCredential'
                - type: object
                  required: [device]
                  properties:
                    device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401':
          description: Token yaroqsiz, muddati o'tgan, `aud`/`iss`/nonce mos emas yoki qayta ishlatilgan (`SOCIAL_TOKEN_INVALID`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validatsiya xatosi yoki provider sozlanmagan (`SOCIAL_PROVIDER_DISABLED`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Provider JWKS'i vaqtincha mavjud emas (`UPSTREAM_UNAVAILABLE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/auth/telegram/start:
    get:
      tags: [Auth]
      operationId: telegramOAuthStart
      summary: Telegram OAuth'ni brauzerda boshlash
      description: |
        Mobil ilova buni tizim brauzerida ochadi (`WebBrowser.openAuthSessionAsync`). Server `oauth.telegram.org/auth` ga
        yo'naltiradi; Telegram natijani `/v1/auth/telegram/return` ga qaytaradi, u esa `redirect_uri#tgAuthResult=<base64 JSON>`
        ga uzatadi. Bot domeni @BotFather'da `/setdomain` bilan API host'iga bog'langan bo'lishi kerak.
      security: []
      parameters:
        - $ref: '#/components/parameters/TelegramRedirectUri'
      responses:
        '200':
          description: "`Accept: application/json` bo'lsa — yo'naltirish URL'i (web popup uchun)"
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '302':
          description: oauth.telegram.org ga yo'naltirish (brauzer)
          headers:
            Location:
              schema: { type: string, format: uri }
        '422':
          description: "`redirect_uri` allowlist'da yo'q yoki Telegram sozlanmagan"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/auth/telegram/return:
    get:
      tags: [Auth]
      operationId: telegramOAuthReturn
      summary: Telegram OAuth qaytish sahifasi
      description: |
        Kichik HTML sahifa: fragment'dagi `tgAuthResult` (yoki query'dagi widget maydonlari)ni o'zgartirmasdan ilovaning
        `redirect_uri`siga uzatadi. Hash tekshiruvi `POST /v1/auth/social` da. `redirect_uri` faqat `TELEGRAM_APP_REDIRECTS`
        prefikslaridan biri bilan boshlanishi mumkin (open redirect himoyasi).
      security: []
      parameters:
        - $ref: '#/components/parameters/TelegramRedirectUri'
      responses:
        '200':
          description: "Yo'naltiruvchi HTML (CSP nonce, `Cache-Control: no-store`)"
          content:
            text/html:
              schema: { type: string }
        '422':
          description: "`redirect_uri` allowlist'da yo'q"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Token yangilash (rotation)
      description: Eski refresh token qayta ishlatilsa — butun token family bekor qilinadi (o'g'irlik belgisi).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Yangi token juftligi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Joriy sessiyani bekor qilish
      responses:
        '204': { description: Sessiya bekor qilindi }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===========================================================================
  # PROFILE
  # ===========================================================================
  /v1/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Joriy foydalanuvchi profili
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Profilni yangilash (onboarding ham shu)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Yangilangan profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Profile]
      operationId: requestAccountErasure
      summary: Akkauntni o'chirish (GDPR erasure)
      description: |
        `due_at` gacha (30 kunlik grace) `DELETE /v1/me/erasure-request` bilan bekor qilish mumkin. Keyin job anonimlashtiradi:
        telefon, email, ismlar, tug'ilgan sana, avatar o'chiriladi (`display_name = Deleted user`); kirish usullari, sessiyalar,
        push token'lar va highlight teglari o'chiriladi; kelgusi booking'lar cancellation policy bo'yicha bekor qilinadi.
        Consent'lar, waiver imzolari va to'lov yozuvlari (huquqiy dalil / soliq) anonim akkauntga bog'liq holda qoladi.
        Hamyonda balans yoki faol host tayinlovi bo'lsa — erasure bloklanadi, sababi `blocked_reasons` da.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '202':
          description: So'rov qabul qilindi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '409':
          description: Ochiq erasure so'rovi allaqachon bor (`ERASURE_PENDING`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/me/erasure-request:
    delete:
      tags: [Profile]
      operationId: cancelAccountErasure
      summary: Akkauntni o'chirish so'rovini bekor qilish (grace davrida)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: So'rov bekor qilindi (`status = cancelled`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '404':
          description: Ochiq erasure so'rovi yo'q (yoki allaqachon bajarilgan)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/me/identities:
    get:
      tags: [Profile]
      operationId: listMyIdentities
      summary: Kirish usullari (telefon, Google, Apple, Telegram)
      responses:
        '200':
          description: Bog'langan identity'lar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Profile]
      operationId: linkIdentity
      summary: Joriy akkauntga social identity bog'lash
      description: |
        Credential `POST /v1/auth/social` dagi kabi tekshiriladi. Identity boshqa akkauntga bog'langan bo'lsa — `IDENTITY_IN_USE`
        (akkauntlar birlashtirilmaydi); shu provider'dan boshqa identity bog'langan bo'lsa — `ALREADY_EXISTS`.
        O'sha identity qayta bog'lansa — o'zgarishsiz 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialCredential' }
      responses:
        '200':
          description: Yangilangan ro'yxat
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthIdentity' }
        '401':
          description: Kirilmagan yoki credential yaroqsiz (`SOCIAL_TOKEN_INVALID`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "`IDENTITY_IN_USE` yoki `ALREADY_EXISTS`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/identities/{provider}:
    delete:
      tags: [Profile]
      operationId: unlinkIdentity
      summary: Social identity'ni uzish
      description: Oxirgi kirish usulini uzib bo'lmaydi (`LAST_LOGIN_METHOD`). Telefon bu yerda uzilmaydi.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple, telegram] }
      responses:
        '204': { description: Uzildi }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Bu yagona kirish usuli (`LAST_LOGIN_METHOD`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/sports/{sportCode}:
    put:
      tags: [Profile]
      operationId: upsertSportProfile
      summary: Sport bo'yicha daraja va pozitsiya
      parameters:
        - name: sportCode
          in: path
          required: true
          schema: { type: string, examples: [football] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [self_level]
              properties:
                self_level: { $ref: '#/components/schemas/SkillLevel' }
                preferred_position: { type: string, examples: [midfielder] }
      responses:
        '200':
          description: Saqlandi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SportProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/consents:
    put:
      tags: [Profile]
      operationId: updateConsents
      summary: Rozilik (consent) holatlarini yangilash
      description: Har bir o'zgarish append-only yozuv sifatida saqlanadi (versiya, IP, manba bilan).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consents]
              properties:
                consents:
                  type: array
                  items: { $ref: '#/components/schemas/ConsentInput' }
      responses:
        '200':
          description: Joriy holat
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/data-export:
    post:
      tags: [Profile]
      operationId: requestDataExport
      summary: Shaxsiy ma'lumotlarni eksport qilish (GDPR Art. 15/20)
      description: |
        Job JSON fayl tayyorlaydi (odatda 1 daqiqa ichida): profil, rollar, kirish usullari, sport profillari, consent tarixi,
        booking'lar, to'lovlar (summa, provider, holat, sana — karta ma'lumoti yo'q), refund'lar, hamyon, waiver imzolari,
        check-in'lar, xabarnomalar, sessiyalar, host ma'lumotlari. Tayyor bo'lgach `DataExportReady` event'i (push).
        Ochiq so'rov bo'lsa — yangisi yaratilmaydi, o'sha qaytariladi.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '202':
          description: So'rov qabul qilindi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/me/data-requests:
    get:
      tags: [Profile]
      operationId: listMyDataRequests
      summary: GDPR so'rovlarim (eksport va erasure holati)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Oxirgi 50 ta so'rov, yangisi birinchi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DataSubjectRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/data-exports/{id}:
    get:
      tags: [Profile]
      operationId: downloadDataExport
      summary: Eksport faylini yuklab olish
      description: Faqat so'rov egasi va faqat `expires_at` gacha (standart 7 kun). Muddat o'tgach fayl o'chiriladi.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "JSON fayl (`Content-Disposition: attachment`)"
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="matchup-data-2026-10-20.json"'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalDataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Hali tayyor emas (`EXPORT_NOT_READY`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: Yuklab olish muddati tugagan (`EXPORT_EXPIRED`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/me/wallet:
    get:
      tags: [Profile]
      operationId: getMyWallet
      summary: Hamyon balansi
      description: |
        Ichki hamyon (refund/promo kreditlari). `balance` — asosiy valyutada (foydalanuvchi shahri valyutasi,
        shahar tanlanmagan bo'lsa davlat valyutasi); hamyon hali ochilmagan bo'lsa `0`. `formatted` — `Accept-Language` bo'yicha.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Balans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/devices:
    put:
      tags: [Notifications]
      operationId: registerDevice
      summary: Push token'ni ro'yxatdan o'tkazish / yangilash
      description: |
        Ilova har ochilganda (va token o'zgarganda) chaqiradi — idempotent upsert `push_token` bo'yicha.
        Token boshqa akkauntga tegishli bo'lsa (umumiy qurilma) joriy foydalanuvchiga o'tadi;
        avval o'chirilgan (`DeviceNotRegistered`) token qayta faollashadi.
        `locale` berilmasa — `Accept-Language`.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Qurilma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/devices/{token}:
    delete:
      tags: [Notifications]
      operationId: unregisterDevice
      summary: Push token'ni o'chirish (logout)
      description: Faqat o'z token'ini o'chiradi. Idempotent — token topilmasa ham `204`.
      parameters:
        - name: token
          in: path
          required: true
          description: URL-encoded push token (`ExponentPushToken%5B...%5D`)
          schema: { type: string }
      responses:
        '204': { description: O'chirildi }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/notifications:
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: Xabarlar tarixi (eng yangisi birinchi)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Xabarlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/notifications/read:
    post:
      tags: [Notifications]
      operationId: markNotificationsRead
      summary: Xabarlarni o'qilgan deb belgilash
      description: '`ids` (1–100 ta) yoki `{ "all": true }`. Javobda yangilangan son va qolgan o''qilmaganlar (badge).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkNotificationsRead' }
      responses:
        '200':
          description: Natija
          content:
            application/json:
              schema:
                type: object
                required: [updated, unread_count]
                properties:
                  updated: { type: integer }
                  unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/me/bookings:
    get:
      tags: [Bookings]
      operationId: listMyBookings
      summary: Mening booking'larim
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Booking'lar ro'yxati
          content:
            application/json:
